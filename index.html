<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beach Time!</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chalkboard SE', 'Comic Sans MS', 'Segoe UI Rounded', cursive;
    }

    /* ══════════════════════════════════════════
       FULL-SCREEN BLURRED BACKDROP
       Fills any letterbox area with a blurred
       version of the current background image.
    ══════════════════════════════════════════ */
    #backdrop {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(22px) brightness(0.5);
      transform: scale(1.07); /* hide blur edge fringe */
      z-index: 0;
    }

    /* ══════════════════════════════════════════
       GAME CONTAINER — 3:2 aspect ratio
    ══════════════════════════════════════════ */
    #game {
      position: relative;
      width: min(100vw, calc(100vh * 1.5));
      height: min(calc(100vw / 1.5), 100vh);
      overflow: hidden;
      z-index: 1;
    }

    /* In-game background layer */
    #bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }

    /* ══════════════════════════════════════════
       START SCREEN
       Semi-transparent warm overlay on top of
       close-door.png (set as #bg on page load).
    ══════════════════════════════════════════ */
    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(255, 245, 215, 0.52);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vh, 38px);
      z-index: 100;
    }

    /* ══════════════════════════════════════════
       SPEECH BUBBLE — shared across all states
    ══════════════════════════════════════════ */
    .bubble {
      position: relative;
      background: #fff;
      border: 4px solid #f0901c;
      border-radius: 22px;
      padding: clamp(10px, 1.8vw, 18px) clamp(20px, 4vw, 44px);
      font-size: clamp(1rem, 3vw, 1.9rem);
      font-weight: 900;
      color: #333;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.16);
      white-space: nowrap;
    }
    /* Downward speech-bubble tail */
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -18px; left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-top-color: #fff;
      z-index: 1;
    }
    .bubble::before {
      content: '';
      position: absolute;
      bottom: -23px; left: 50%;
      transform: translateX(-50%);
      border: 13px solid transparent;
      border-top-color: #f0901c;
    }

    /* ══════════════════════════════════════════
       BUTTONS — shared pill style
    ══════════════════════════════════════════ */
    .btn {
      background: linear-gradient(135deg, #ff7f2a 0%, #ff5200 100%);
      color: #fff;
      border: none;
      border-radius: 60px;
      padding: clamp(10px, 1.8vh, 18px) clamp(28px, 6.5vw, 70px);
      font-family: inherit;
      font-size: clamp(0.95rem, 2.6vw, 1.75rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 0 #b83c00, 0 10px 24px rgba(255,82,0,0.38);
      transition: transform .12s, box-shadow .12s;
      display: inline-block;
    }
    .btn:hover  { transform: translateY(-3px); }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b83c00, 0 4px 10px rgba(255,82,0,0.28);
    }

    /* ══════════════════════════════════════════
       IN-GAME DIALOG BUBBLE
    ══════════════════════════════════════════ */
    #dialog {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 50;
      pointer-events: none;
      /* inherits .bubble look via JS-added class — see HTML */
    }

    /* ══════════════════════════════════════════
       DOOR REGIONS
    ══════════════════════════════════════════ */
    /* Generous invisible click/drop areas */
    #door-click-zone,
    #door-drop-zone {
      position: absolute;
      display: none;
    }
    #door-click-zone { z-index: 25; cursor: pointer; }
    #door-drop-zone  { z-index: 15; }

    /* Small circular ripple hint at door centre */
    #door-hint {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 222, 0, 0.35);
      border: 3px solid rgba(255, 222, 0, 0.9);
      pointer-events: none;
      display: none;
      z-index: 30;
      /* animation defined below with @keyframes ripplePulse */
    }

    /* ══════════════════════════════════════════
       ROOM DOG — states 1 & 2
    ══════════════════════════════════════════ */
    #dog {
      position: absolute;
      display: none;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 20;
    }
    #dog.drag-hint { animation: dogBounce 1s ease-in-out infinite; }

    /* ══════════════════════════════════════════
       BEACH DOG — states 3–6
    ══════════════════════════════════════════ */
    #beach-dog {
      position: absolute;
      width: 26%;
      left: 50%;
      transform: translateX(-50%);
      bottom: 30%;
      display: none;
      z-index: 20;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ══════════════════════════════════════════
       ITEMS — states 3–5
    ══════════════════════════════════════════ */
    .item {
      position: absolute;
      display: none;
      z-index: 21;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform .15s;
    }
    .item:hover { transform: scale(1.07); }

    #juice-item    { width: 20%; left: 17%; bottom: 3%; }
    #suncream-item { width: 13%; left: 44%; bottom: 3%; }
    #swimring-item { width: 14%; right: 2%; bottom: 3%; cursor: grab; } /* lower-right corner */

    /* ══════════════════════════════════════════
       STATE 6 — CONGRATULATIONS + GOLD + RESTART
    ══════════════════════════════════════════ */
    #congrats {
      /* styled as a bubble — animation fully controlled via .entering / .bouncing classes */
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 60;
      pointer-events: none;
    }

    #gold {
      position: absolute;
      width: 50%;
      left: 50%;
      transform: translateX(-50%);
      bottom: 10%;
      display: none;
      z-index: 40;
      pointer-events: none;
      /* animation fully controlled via .entering / .show classes below */
    }

    #restart-btn {
      position: absolute;
      bottom: 3%;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 70;
    }

    /* ══════════════════════════════════════════
       WILL-CHANGE — GPU-composite animated layers
    ══════════════════════════════════════════ */
    #dog, #beach-dog, #gold, #congrats { will-change: transform, filter; }
    .item { will-change: transform; }
    #door-hint { will-change: transform, box-shadow, opacity; }

    /* ══════════════════════════════════════════
       KEYFRAMES
    ══════════════════════════════════════════ */

    /* ── Circular ripple — door hint ──
       Three concentric rings expand from the core
       and fade out — cleaner than box-shadow layers. */
    @keyframes ripplePulse {
      0%   { transform: scale(1);   box-shadow: 0 0 0  0px rgba(255,222,0,0.9), 0 0 0  0px rgba(255,222,0,0.55), 0 0 0  0px rgba(255,222,0,0.25); opacity: 1; }
      70%  { transform: scale(1.2); box-shadow: 0 0 0 16px rgba(255,222,0,0.2), 0 0 0 32px rgba(255,222,0,0.1), 0 0 0 48px rgba(255,222,0,0.03); opacity: 1; }
      100% { transform: scale(1);   box-shadow: 0 0 0  0px rgba(255,222,0,0),   0 0 0  0px rgba(255,222,0,0),   0 0 0  0px rgba(255,222,0,0);    opacity: 0.65; }
    }
    #door-hint { animation: ripplePulse 2s cubic-bezier(0.2, 0.6, 0.4, 1) infinite; }

    /* ── Dog drag hint — soft sine bounce with glow ── */
    @keyframes dogBounce {
      0%   { transform: translateY(0px)   scale(1);    filter: drop-shadow(0 0  5px rgba(255,220,0,0.55)); }
      45%  { transform: translateY(-13px) scale(1.03); filter: drop-shadow(0 0 22px rgba(255,220,0,1)); }
      55%  { transform: translateY(-13px) scale(1.03); filter: drop-shadow(0 0 22px rgba(255,220,0,1)); }
      100% { transform: translateY(0px)   scale(1);    filter: drop-shadow(0 0  5px rgba(255,220,0,0.55)); }
    }
    #dog.drag-hint { animation: dogBounce 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* ── Wrong-target shake ── */
    @keyframes shake {
      0%, 100% { transform: translateX(0)    rotate(0deg); }
      18%       { transform: translateX(-10px) rotate(-4deg); }
      36%       { transform: translateX( 10px) rotate( 4deg); }
      54%       { transform: translateX( -6px) rotate(-2deg); }
      72%       { transform: translateX(  6px) rotate( 2deg); }
      88%       { transform: translateX( -3px) rotate(-1deg); }
    }
    .shaking { animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important; }

    /* ── Dialog pop-in ── */
    @keyframes dialogPop {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.7) translateY(-8px); }
      65%  { opacity: 1; transform: translateX(-50%) scale(1.06) translateY(2px); }
      100% { opacity: 1; transform: translateX(-50%) scale(1)    translateY(0); }
    }
    #dialog.popping { animation: dialogPop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* ── Item pop-in (staggered via animation-delay in JS) ── */
    @keyframes itemPop {
      0%   { opacity: 0; transform: scale(0.4) translateY(22px); }
      70%  { opacity: 1; transform: scale(1.1) translateY(-4px); }
      100% { opacity: 1; transform: scale(1)   translateY(0); }
    }
    .item.popping { animation: itemPop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

    /* ── Beach dog fade-slide in ── */
    @keyframes heroIn {
      from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.92); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0)    scale(1); }
    }
    #beach-dog.entering { animation: heroIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* ── Congrats: pop-in, then hand off to bouncePop ── */
    @keyframes congratsPop {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.3) translateY(16px); }
      70%  { opacity: 1; transform: translateX(-50%) scale(1.12) translateY(-4px); }
      100% { opacity: 1; transform: translateX(-50%) scale(1)    translateY(0); }
    }
    @keyframes bouncePop {
      from { transform: translateX(-50%) translateY(0px)   scale(1); }
      to   { transform: translateX(-50%) translateY(-11px) scale(1.07); }
    }
    #congrats.entering { animation: congratsPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    #congrats.bouncing { animation: bouncePop   0.65s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate; }

    /* ── Gold: scale-in, then hand off to goldPulse ── */
    @keyframes goldIn {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.4) translateY(30px); }
      70%  { opacity: 1; transform: translateX(-50%) scale(1.06) translateY(-4px); }
      100% { opacity: 1; transform: translateX(-50%) scale(1)    translateY(0); }
    }
    @keyframes goldPulse {
      0%, 100% {
        transform: translateX(-50%) scale(1);
        filter: drop-shadow(0 0 10px rgba(255,215,0,0.45)) drop-shadow(0 0 3px rgba(255,255,180,0.5));
      }
      50% {
        transform: translateX(-50%) scale(1.07);
        filter: drop-shadow(0 0 32px rgba(255,215,0,0.95)) drop-shadow(0 0 60px rgba(255,155,0,0.75)) drop-shadow(0 0 5px rgba(255,255,200,0.9));
      }
    }
    #gold.entering { animation: goldIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    #gold.show     { animation: goldPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* ── Restart button fade-up ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    #restart-btn.entering { animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  </style>
</head>
<body>

<!-- Blurred full-screen backdrop — eliminates coloured letterbox bars -->
<div id="backdrop"></div>

<div id="game">
  <div id="bg"></div>

  <!-- STATE 0: Start screen -->
  <div id="start-screen">
    <div class="bubble">Let's help puppy to swim! 🐾</div>
    <button id="start-btn" class="btn">START ▶</button>
  </div>

  <!-- In-game dialog bubble (reuses .bubble style) -->
  <div id="dialog" class="bubble"></div>

  <!-- Door regions -->
  <div id="door-hint"></div>
  <div id="door-click-zone"></div>
  <div id="door-drop-zone"></div>

  <!-- Room dog — states 1 & 2 -->
  <img id="dog" src="dog.png" draggable="false" alt="dog">

  <!-- Beach dog — states 3–6 -->
  <img id="beach-dog" src="sad-dog.png" draggable="false" alt="beach dog">

  <!-- Collectible items — states 3–5 -->
  <img id="juice-item"    class="item" src="juice.png"     draggable="false" alt="juice">
  <img id="suncream-item" class="item" src="sun-cream.png" draggable="false" alt="sun cream">
  <img id="swimring-item" class="item" src="swim-ring.png" draggable="false" alt="swim ring">

  <!-- STATE 6 victory elements -->
  <div id="congrats" class="bubble">🎉 Congratulations! 🎉</div>
  <img id="gold" src="gold.png" draggable="false" alt="gold treasure">
  <button id="restart-btn" class="btn">PLAY AGAIN ↺</button>
</div>

<script>
/* ══════════════════════════════════════════
   REFS
══════════════════════════════════════════ */
const backdrop    = document.getElementById('backdrop');
const game        = document.getElementById('game');
const bg          = document.getElementById('bg');
const startScreen = document.getElementById('start-screen');
const startBtn    = document.getElementById('start-btn');
const dialogEl    = document.getElementById('dialog');
const doorHint    = document.getElementById('door-hint');
const doorClick   = document.getElementById('door-click-zone');
const doorDrop    = document.getElementById('door-drop-zone');
const dogEl       = document.getElementById('dog');
const beachDog    = document.getElementById('beach-dog');
const juiceEl     = document.getElementById('juice-item');
const suncreamEl  = document.getElementById('suncream-item');
const swimringEl  = document.getElementById('swimring-item');
const congratsEl  = document.getElementById('congrats');
const goldEl      = document.getElementById('gold');
const restartBtn  = document.getElementById('restart-btn');

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let state = 0;
let s6Timer = null; // guard for STATE 6 delayed reveal

/* ══════════════════════════════════════════
   BACKGROUND HELPER
   Syncs both the in-game layer and the blurred backdrop.
══════════════════════════════════════════ */
function setBg(url) {
  bg.style.backgroundImage       = url;
  backdrop.style.backgroundImage = url;
}

/* ══════════════════════════════════════════
   DOOR GEOMETRY
   Percentages measured from close-door.png (1080×719).
   Door frame spans ≈ left 27%–46%, top 3%–90%.
══════════════════════════════════════════ */
const DOOR = { L: 0.27, R: 0.46, T: 0.03, B: 0.90 };

/** Position the invisible click / drop rectangles over the door. */
function applyDoorZones() {
  const { width: W, height: H } = game.getBoundingClientRect();
  const l = DOOR.L * W,             t = DOOR.T * H;
  const w = (DOOR.R - DOOR.L) * W, h = (DOOR.B - DOOR.T) * H;
  [doorClick, doorDrop].forEach(el => {
    el.style.left = l + 'px'; el.style.top    = t + 'px';
    el.style.width = w + 'px'; el.style.height = h + 'px';
  });
}

/** Position the small circular ripple hint at the door's centre. */
function applyDoorHint() {
  const { width: W, height: H } = game.getBoundingClientRect();
  const cx = ((DOOR.L + DOOR.R) / 2) * W;
  const cy = ((DOOR.T + DOOR.B) / 2) * H;
  const r  = Math.max(22, Math.round(W * 0.033)); // ~3.3% of game width
  doorHint.style.width  = (r * 2) + 'px';
  doorHint.style.height = (r * 2) + 'px';
  doorHint.style.left   = (cx - r) + 'px';
  doorHint.style.top    = (cy - r) + 'px';
}

/* ══════════════════════════════════════════
   UI HELPERS
══════════════════════════════════════════ */
function showDialog(text) {
  dialogEl.textContent = text;
  dialogEl.style.display = 'block';
  // Re-trigger pop-in animation
  dialogEl.classList.remove('popping');
  void dialogEl.offsetWidth;
  dialogEl.classList.add('popping');
  dialogEl.addEventListener('animationend', () => dialogEl.classList.remove('popping'), { once: true });
}
function hideDialog() { dialogEl.style.display = 'none'; }

function shake(el) {
  el.classList.remove('shaking');
  void el.offsetWidth; // force reflow to restart animation
  el.classList.add('shaking');
  el.addEventListener('animationend', () => el.classList.remove('shaking'), { once: true });
}

function hideGameElements() {
  if (s6Timer) { clearTimeout(s6Timer); s6Timer = null; }
  [doorHint, doorClick, doorDrop].forEach(e => { e.style.display = 'none'; });
  dogEl.style.display = 'none';
  dogEl.classList.remove('drag-hint');
  beachDog.style.display = 'none';
  beachDog.classList.remove('entering');
  [juiceEl, suncreamEl, swimringEl].forEach(e => {
    e.style.display = 'none';
    e.classList.remove('popping');
    e.style.animationDelay = '';
  });
  // Clear any inline positional styles left over from dragging the swim ring,
  // so the CSS rule (right:2%; bottom:3%) is fully restored on the next round.
  ['left','top','right','bottom','zIndex','cursor','transition'].forEach(p => {
    swimringEl.style[p] = '';
  });
  congratsEl.style.display = 'none';
  congratsEl.classList.remove('entering', 'bouncing');
  goldEl.style.display     = 'none';
  goldEl.classList.remove('entering', 'show');
  restartBtn.style.display = 'none';
  restartBtn.classList.remove('entering');
  hideDialog();
  dialogEl.classList.remove('popping');
}

/* ══════════════════════════════════════════
   STATE MACHINE
══════════════════════════════════════════ */
function enter(n) {
  state = n;
  ({ 1: s1, 2: s2, 3: s3, 4: s4, 5: s5, 6: s6 })[n]?.();
}

/* ── STATE 1 — Closed door ── */
function s1() {
  hideGameElements();
  setBg("url('close-door.png')");
  applyDoorZones();
  applyDoorHint();
  doorHint.style.display  = 'block';
  doorClick.style.display = 'block';

  Object.assign(dogEl.style, {
    display:    'block',
    width:      '32%',   // bigger dog
    right:      '2%',
    bottom:     '0%',
    left:       'auto',
    top:        'auto',
    cursor:     'default',
    zIndex:     '20',
    transition: ''
  });
}

/* ── STATE 2 — Open door ── */
function s2() {
  setBg("url('open-door.png')");
  doorHint.style.display  = 'none';
  doorClick.style.display = 'none';
  applyDoorZones();
  doorDrop.style.display = 'block';

  dogEl.style.cursor = 'grab';
  dogEl.classList.add('drag-hint');
}

/* ── STATE 3 — Beach + items ── */
function s3() {
  hideGameElements();
  setBg("url('beach.png')");

  // Beach dog enters with a fade-slide
  beachDog.src = 'sad-dog.png';
  beachDog.style.display = 'block';
  beachDog.classList.remove('entering');
  void beachDog.offsetWidth;
  beachDog.classList.add('entering');
  beachDog.addEventListener('animationend', () => beachDog.classList.remove('entering'), { once: true });

  // Items pop in with a staggered delay
  [juiceEl, suncreamEl, swimringEl].forEach((e, i) => {
    e.style.display = 'block';
    e.style.animationDelay = (i * 0.12) + 's';
    e.classList.remove('popping');
    void e.offsetWidth;
    e.classList.add('popping');
    e.addEventListener('animationend', () => {
      e.classList.remove('popping');
      e.style.animationDelay = '';
    }, { once: true });
  });

  showDialog("I'm so thirsty 💧");
}

/* ── STATE 4 — After juice ── */
function s4() {
  beachDog.src           = 'dog-juice.png';
  juiceEl.style.display  = 'none';
  showDialog("The sun is really hot today! ☀️");
}

/* ── STATE 5 — After sun cream ── */
function s5() {
  beachDog.src               = 'dog-juice-sun%20cream.png';
  suncreamEl.style.display   = 'none';
  showDialog("That swim ring looks pretty! 🏊");
}

/* ── STATE 6 — Victory ── */
function s6() {
  // Step 1: show happy dog alone for 3 s
  beachDog.src             = 'happy-dog.png';
  swimringEl.style.display = 'none';
  hideDialog();

  // Step 2: staggered reveal — congrats → gold → restart
  s6Timer = setTimeout(() => {
    s6Timer = null;
    if (state !== 6) return;

    // Congrats: pop-in, then hand off to infinite bounce
    congratsEl.style.display = 'block';
    congratsEl.classList.remove('entering', 'bouncing');
    void congratsEl.offsetWidth;
    congratsEl.classList.add('entering');
    congratsEl.addEventListener('animationend', () => {
      congratsEl.classList.replace('entering', 'bouncing');
    }, { once: true });

    // Gold: pop-in after 220 ms, then hand off to glitter pulse
    setTimeout(() => {
      if (state !== 6) return;
      goldEl.style.display = 'block';
      goldEl.classList.remove('entering', 'show');
      void goldEl.offsetWidth;
      goldEl.classList.add('entering');
      goldEl.addEventListener('animationend', () => {
        goldEl.classList.replace('entering', 'show');
      }, { once: true });
    }, 220);

    // Restart button: fade-up after 440 ms
    setTimeout(() => {
      if (state !== 6) return;
      restartBtn.style.display = 'block';
      restartBtn.classList.remove('entering');
      void restartBtn.offsetWidth;
      restartBtn.classList.add('entering');
      restartBtn.addEventListener('animationend', () => {
        restartBtn.classList.remove('entering');
      }, { once: true });
    }, 440);

  }, 3000);
}

/* ══════════════════════════════════════════
   CLICK INTERACTIONS
══════════════════════════════════════════ */
startBtn.addEventListener('click', () => {
  startScreen.style.display = 'none';
  enter(1);
});

restartBtn.addEventListener('click', () => {
  hideGameElements();
  state = 0;
  setBg("url('close-door.png')");
  startScreen.style.display = ''; // restore flex via CSS
});

doorClick.addEventListener('click', () => { if (state === 1) enter(2); });

juiceEl.addEventListener('click', () => {
  if (state === 3) { enter(4); return; }
  if (state === 4 || state === 5) shake(juiceEl);
});

suncreamEl.addEventListener('click', () => {
  if (state === 4) { enter(5); return; }
  if (state === 3 || state === 5) shake(suncreamEl);
});

swimringEl.addEventListener('click', () => {
  if (state === 5) shake(swimringEl); // must be dragged, not clicked
});

/* ══════════════════════════════════════════
   DRAG & DROP (mouse + touch)
══════════════════════════════════════════ */
let dragged = null, ox = 0, oy = 0;

function startDrag(el, cx, cy) {
  dragged = el;
  const gr = game.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  ox = cx - er.left;
  oy = cy - er.top;

  // Convert from percentage-based positioning to pixel left/top
  el.style.transition = 'none';
  el.style.left       = (er.left - gr.left) + 'px';
  el.style.top        = (er.top  - gr.top)  + 'px';
  el.style.right      = 'auto';
  el.style.bottom     = 'auto';
  el.style.zIndex     = '999';
  el.style.cursor     = 'grabbing';
  el.classList.remove('drag-hint', 'shaking');
}

function moveDrag(cx, cy) {
  if (!dragged) return;
  const gr = game.getBoundingClientRect();
  dragged.style.left = (cx - gr.left - ox) + 'px';
  dragged.style.top  = (cy - gr.top  - oy) + 'px';
}

function endDrag(cx, cy) {
  if (!dragged) return;
  const el = dragged;
  dragged = null;

  const hit = centerHitTest(el);

  if (el === dogEl && state === 2) {
    if (hit === 'door') { enter(3); return; }
    shake(el);
    returnDogHome();
    return;
  }
  if (el === swimringEl && state === 5) {
    if (hit === 'beach-dog') { enter(6); return; }
    shake(el);
    returnSwimringHome();
  }
}

/** True if the dragged element's centre is inside the target element. */
function centerHitTest(el) {
  const er = el.getBoundingClientRect();
  const cx = (er.left + er.right)  / 2;
  const cy = (er.top  + er.bottom) / 2;

  if (el === dogEl) {
    const dr = doorDrop.getBoundingClientRect();
    if (cx >= dr.left && cx <= dr.right && cy >= dr.top && cy <= dr.bottom)
      return 'door';
  }
  if (el === swimringEl) {
    const br = beachDog.getBoundingClientRect();
    if (cx >= br.left && cx <= br.right && cy >= br.top && cy <= br.bottom)
      return 'beach-dog';
  }
  return null;
}

/** Animate dog back to its home position (right:2%, bottom:0%) with spring easing. */
function returnDogHome() {
  const gr = game.getBoundingClientRect();
  const ew = dogEl.getBoundingClientRect().width;
  const eh = dogEl.getBoundingClientRect().height;

  const SPRING = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
  dogEl.style.transition = `left 0.5s ${SPRING}, top 0.5s ${SPRING}`;
  dogEl.style.left   = (gr.width  - ew - gr.width * 0.02) + 'px';
  dogEl.style.top    = (gr.height - eh) + 'px';
  dogEl.style.right  = 'auto';
  dogEl.style.bottom = 'auto';

  setTimeout(() => {
    Object.assign(dogEl.style, {
      transition: '', left: 'auto', top: 'auto',
      right: '2%', bottom: '0%', zIndex: '20', cursor: 'grab'
    });
    dogEl.classList.add('drag-hint');
  }, 520);
}

/** Animate swim ring back to lower-right corner (right:2%, bottom:3%) with spring easing. */
function returnSwimringHome() {
  const gr = game.getBoundingClientRect();
  const ew = swimringEl.getBoundingClientRect().width;
  const eh = swimringEl.getBoundingClientRect().height;

  // Pixel equivalent of CSS: right:2%, bottom:3%
  const targetLeft = gr.width  - ew - gr.width  * 0.02;
  const targetTop  = gr.height - eh - gr.height * 0.03;

  const SPRING = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
  swimringEl.style.transition = `left 0.5s ${SPRING}, top 0.5s ${SPRING}`;
  swimringEl.style.left   = targetLeft + 'px';
  swimringEl.style.top    = targetTop  + 'px';
  swimringEl.style.right  = 'auto';
  swimringEl.style.bottom = 'auto';

  setTimeout(() => {
    // Clear inline styles → CSS class (right:2%, bottom:3%) takes over
    ['left','top','right','bottom','zIndex','cursor','transition'].forEach(p => {
      swimringEl.style[p] = '';
    });
    swimringEl.style.display = 'block'; // CSS class has display:none; keep it visible
  }, 520);
}

/* ── Mouse events ── */
dogEl.addEventListener('mousedown', e => {
  if (state !== 2) return;
  e.preventDefault();
  startDrag(dogEl, e.clientX, e.clientY);
});
swimringEl.addEventListener('mousedown', e => {
  if (state !== 5) return;
  e.preventDefault();
  startDrag(swimringEl, e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => { moveDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup',   e => { endDrag(e.clientX, e.clientY); });

/* ── Touch events ── */
dogEl.addEventListener('touchstart', e => {
  if (state !== 2) return;
  e.preventDefault();
  startDrag(dogEl, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
swimringEl.addEventListener('touchstart', e => {
  if (state !== 5) return;
  e.preventDefault();
  startDrag(swimringEl, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (!dragged) return;
  e.preventDefault();
  moveDrag(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
document.addEventListener('touchend', e => {
  if (!dragged) return;
  endDrag(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
});

/* ── Resize: recalculate door layout ── */
window.addEventListener('resize', () => {
  if (state === 1) { applyDoorZones(); applyDoorHint(); }
  if (state === 2) { applyDoorZones(); }
});

/* ══════════════════════════════════════════
   INIT — set background for the start screen
══════════════════════════════════════════ */
setBg("url('close-door.png')");
</script>
</body>
